<!doctype html>
<!--
  cuts: Lichtschnitte über den drei Szenenwechseln der Demo.
  Nach dem Muster von light-sweep-pass: ein schräges Lichtband im
  Revetly-Verlauf läuft einmal durchs Bild, mit heller Vorderkante. Es
  verdeckt den Schnitt darunter. Zeiten kommen als Variablen aus
  scripts/hyperframes.mjs (also aus src/config/demo-timing.ts).
-->
<html
  lang="de"
  data-composition-id="cuts"
  data-composition-variables='[
    { "id": "at", "type": "string", "label": "Schnittzeiten (s, kommagetrennt)", "default": "5,15,25" },
    { "id": "span", "type": "number", "label": "Dauer eines Laufs (s)", "default": 0.8 }
  ]'
>
  <body>
    <template>
      <div id="root" data-composition-id="cuts" data-width="1920" data-height="1080">
        <style>
          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
          }
          #cuts-clip {
            position: absolute;
            inset: 0;
          }
          .cuts-band {
            position: absolute;
            top: -40%;
            left: 0;
            width: 900px;
            height: 180%;
            opacity: 0;
            background: linear-gradient(
              90deg,
              rgba(34, 193, 238, 0) 0%,
              rgba(34, 193, 238, 0.18) 30%,
              rgba(22, 199, 124, 0.42) 62%,
              rgba(232, 255, 246, 0.9) 70%,
              rgba(22, 199, 124, 0.25) 74%,
              rgba(22, 199, 124, 0) 100%
            );
            filter: blur(6px);
          }
        </style>

        <div id="cuts-clip" class="clip" data-start="0" data-duration="30" data-track-index="0" data-layout-allow-overflow>
          <div id="cuts-band-0" class="cuts-band"></div>
          <div id="cuts-band-1" class="cuts-band"></div>
          <div id="cuts-band-2" class="cuts-band"></div>
        </div>

        <script src="assets/gsap.min.js"></script>
        <script>
          (function () {
            var root = document.getElementById("root")
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {}
            var times = String(vars.at == null ? "5,15,25" : vars.at).split(",").map(Number).filter(Number.isFinite)
            var span = Number(vars.span) > 0 ? Number(vars.span) : 0.8

            var tl = gsap.timeline({ paused: true })
            times.slice(0, 3).forEach(function (cut, i) {
              var band = root.querySelector("#cuts-band-" + i)
              var start = cut - span / 2
              // schräg gestellt, läuft von links nach rechts; die Mitte trifft den Schnitt
              gsap.set(band, { rotation: 14, x: -1100, opacity: 0 })
              tl.fromTo(band, { x: -1100 }, { x: 2200, duration: span, ease: "power3.inOut", immediateRender: false }, start)
              tl.fromTo(band, { opacity: 0 }, { opacity: 1, duration: span * 0.25, ease: "power1.out", immediateRender: false }, start)
              tl.to(band, { opacity: 0, duration: span * 0.25, ease: "power1.in" }, start + span * 0.75)
            })

            tl.seek(0)
            window.__timelines = window.__timelines || {}
            window.__timelines["cuts"] = tl
          })()
        </script>
      </div>
    </template>
  </body>
</html>
