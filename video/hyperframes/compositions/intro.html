<!doctype html>
<!--
  intro: „Recruiting is time-consuming." als Headline-Slam.
  Nach dem Muster des Registry-Blocks headline-slam: Zeile fällt von 1.6 auf 1
  (expo.out), drei Frames Erschütterung beim Aufprall, ruhiges Halten, dann
  peitscht sie nach oben aus dem Bild. Hintergrund transparent: Remotion
  legt das Ergebnis über die Szene.
-->
<html
  lang="de"
  data-composition-id="intro"
  data-composition-variables='[
    { "id": "text", "type": "string", "label": "Headline", "default": "Recruiting is time-consuming." },
    { "id": "accent_from", "type": "number", "label": "Ab Wort (Akzent)", "default": 2 }
  ]'
>
  <body>
    <template>
      <div id="root" data-composition-id="intro" data-width="1920" data-height="1080">
        <style>
          @font-face {
            font-family: "Plus Jakarta Sans";
            src: url("assets/fonts/pjs-normal-latin.woff2") format("woff2");
            font-weight: 200 800;
          }
          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
          }
          #intro-clip {
            position: absolute;
            inset: 0;
          }
          #intro-stage {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
          }
          #intro-headline {
            font-family: "Plus Jakarta Sans", sans-serif;
            font-weight: 800;
            font-size: 104px;
            letter-spacing: -0.045em;
            line-height: 1;
            color: #e8f2f2;
            white-space: nowrap;
            text-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
          }
          .intro-word {
            display: inline-block;
            margin-right: 0.24em;
          }
          .intro-word:last-child {
            margin-right: 0;
          }
          .intro-accent {
            color: rgba(232, 242, 242, 0.55);
          }
        </style>

        <div id="intro-clip" class="clip" data-start="0" data-duration="1.85" data-track-index="0">
          <div id="intro-stage">
            <div id="intro-headline"></div>
          </div>
        </div>

        <script src="assets/gsap.min.js"></script>
        <script>
          (function () {
            var root = document.getElementById("root")
            var stage = root.querySelector("#intro-stage")
            var headline = root.querySelector("#intro-headline")
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {}
            var text = vars.text == null ? "Recruiting is time-consuming." : String(vars.text)
            var accentFrom = Number.isFinite(Number(vars.accent_from)) ? Number(vars.accent_from) : 2

            text.split(/\s+/).forEach(function (w, i) {
              var span = document.createElement("span")
              span.className = i >= accentFrom ? "intro-word intro-accent" : "intro-word"
              span.textContent = w
              headline.appendChild(span)
            })
            var words = headline.querySelectorAll(".intro-word")

            var D = Math.max(0.5, parseFloat(root.dataset.duration || "1.85"))
            var LAND = 0.5
            var FRAME = 1 / 30
            var OUT = 0.36

            var tl = gsap.timeline({ paused: true })
            // Slam: groß und unscharf herein, hart landen
            tl.fromTo(headline, { scale: 1.6, opacity: 0, filter: "blur(14px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: LAND, ease: "expo.out" }, 0)
            // Wörter schieben leicht gestaffelt nach (4 Frames)
            tl.fromTo(words, { y: 26 }, { y: 0, duration: LAND, ease: "expo.out", stagger: 4 * FRAME }, 0)
            // drei Frames Erschütterung beim Aufprall
            tl.to(stage, { x: 9, y: -5, duration: FRAME, ease: "power2.out" }, LAND)
            tl.to(stage, { x: -6, y: 3, duration: FRAME, ease: "power2.out" })
            tl.to(stage, { x: 0, y: 0, duration: FRAME, ease: "power2.out" })
            // Halten: minimales Atmen
            tl.fromTo(headline, { y: 0 }, { y: -6, duration: Math.max(0.1, D - LAND - OUT), ease: "sine.inOut", immediateRender: false }, LAND + 3 * FRAME)
            // peitscht nach oben weg
            tl.to(headline, { y: -1300, duration: OUT, ease: "power4.in" }, D - OUT - FRAME)
            tl.to(headline, { filter: "blur(10px)", duration: OUT, ease: "power2.in" }, D - OUT - FRAME)

            tl.seek(0)
            window.__timelines = window.__timelines || {}
            window.__timelines["intro"] = tl
          })()
        </script>
      </div>
    </template>
  </body>
</html>
